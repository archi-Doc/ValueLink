name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: NativeAotTest
          - os: windows-latest
            rid: win-x64
            executable: NativeAotTest.exe
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --solution ValueLink.slnx --configuration Release --no-build --no-restore
    - name: Publish NativeAOT smoke test
      run: dotnet publish NativeAotTest/NativeAotTest.csproj -c Release -r ${{ matrix.rid }} -o artifacts/native-aot/publish
    - name: Run NativeAOT smoke test
      shell: pwsh
      run: |
        & ./artifacts/native-aot/publish/${{ matrix.executable }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
